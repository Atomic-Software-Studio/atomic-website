<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon variant: the outer shell is dropped and the stroke thickened,
       because three orbits plus a ring turn to mush below 32px. -->
  <rect width="100" height="100" fill="#0C1113"/>
  <g stroke="#3FE0CE" stroke-width="6" fill="none" transform="rotate(-12 50 50)">
    <ellipse cx="50" cy="50" rx="36" ry="14"/>
    <ellipse cx="50" cy="50" rx="36" ry="14" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="36" ry="14" transform="rotate(120 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="11" fill="#3FE0CE"/>
</svg>
